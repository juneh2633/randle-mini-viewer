name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'extension/viewer.js', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint
        run: gradle -p android --no-daemon :app:assembleDebug :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test manual controls and PiP
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle -p android --no-daemon :app:connectedDebugAndroidTest
            adb pull /data/local/tmp/randle-pip-smoke.png android/app/build/reports/pip-smoke.png
      - name: Save APK and lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: randle-mini-viewer-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/androidTests/
            android/app/build/reports/pip-smoke.png
          if-no-files-found: error
