name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'extension/viewer.js', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint
        run: gradle -p android --no-daemon :app:assembleDebug :app:lintDebug
      - name: Save APK and lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: randle-mini-viewer-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
