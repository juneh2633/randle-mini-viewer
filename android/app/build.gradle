plugins { id 'com.android.application' }
android {
    namespace 'io.github.juneh2633.randleviewer'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.juneh2633.randleviewer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/viewerAssets'))
}
tasks.register('copyViewer', Copy) {
    from rootProject.file('../extension/viewer.js')
    into layout.buildDirectory.dir('generated/viewerAssets')
}
tasks.named('preBuild').configure { dependsOn 'copyViewer' }
