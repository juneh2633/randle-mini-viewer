plugins { id 'com.android.application' }
android {
    namespace 'io.github.juneh2633.randleviewer'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.juneh2633.randleviewer'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/viewerAssets'))
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
tasks.register('copyViewer', Copy) {
    from rootProject.file('../extension/viewer.js')
    into layout.buildDirectory.dir('generated/viewerAssets')
}
tasks.named('preBuild').configure { dependsOn 'copyViewer' }
